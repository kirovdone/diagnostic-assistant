<svg viewBox="0 0 1200 1128" xmlns="http://www.w3.org/2000/svg" font-family='"IBM Plex Sans",Helvetica,Arial,sans-serif' role="img" aria-label="Sequence diagram of one Diagnostic Assist chat session in twenty-five numbered steps across six participants.">
<style>
 .ln{stroke:#c3ced6;stroke-width:1.6;fill:none}
 .lr{stroke:#c3ced6;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
 .la{stroke:#6b3fa0;stroke-width:1.7;fill:none}
 .lar{stroke:#6b3fa0;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
 .lf{stroke:#c3ced6;stroke-width:1.2;fill:none;stroke-dasharray:4 6}
 .lu{stroke:#2a4d8f;stroke-width:1.8;fill:none}
 .tu{fill:#2a4d8f;font-size:13.5px;font-weight:600}
 .t{fill:#131a20;font-size:13.5px}
 .d{fill:#5a6773;font-size:11.5px;font-family:"IBM Plex Mono",Menlo,Consolas,monospace}
 .ta{fill:#6b3fa0;font-size:13.5px}
 .tc{fill:#0d6a73;font-size:13.5px}
 .hd{fill:#131a20;font-size:14.5px;font-weight:600}
 .tn{fill:#5a6773;font-size:11px;font-family:"IBM Plex Mono",Menlo,Consolas,monospace;letter-spacing:.1em}
 .num{fill:#5a6773;font-size:10.5px;font-family:"IBM Plex Mono",Menlo,Consolas,monospace;text-anchor:middle}
</style>
<rect width="1200" height="1128" fill="#ffffff"/>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#c3ced6"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#0d6a73"/></marker>
<marker id="hai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#6b3fa0"/></marker>
<marker id="hu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#2a4d8f"/></marker>
<rect x="8" y="88" width="1184" height="236" rx="6" fill="#eef2f4" opacity="0.5"/>
<text class="tn" x="20" y="106">TURN 1 &#183; free text</text>
<rect x="8" y="334" width="1184" height="304" rx="6" fill="#eef2f4" opacity="0.5"/>
<text class="tn" x="20" y="352">TURN 2 &#183; a button</text>
<rect x="8" y="648" width="1184" height="304" rx="6" fill="#eef2f4" opacity="0.5"/>
<text class="tn" x="20" y="666">TURN 3 &#183; free text again</text>
<rect x="8" y="962" width="1184" height="134" rx="6" fill="#e3f2ea" opacity="0.55"/>
<text class="tn" x="20" y="980">CLOSE &#183; the record</text>
<rect x="10" y="26" width="150" height="36" rx="5" fill="#e6edf8" stroke="#2a4d8f" stroke-width="1.5"/>
<text class="hd" x="85" y="50" text-anchor="middle">Dispatcher</text>
<line class="lf" x1="85" y1="64" x2="85" y2="1114"/>
<rect x="200" y="26" width="130" height="36" rx="5" fill="#ffffff" stroke="#c3ced6" stroke-width="1.5"/>
<text class="hd" x="265" y="50" text-anchor="middle">Chat screen</text>
<line class="lf" x1="265" y1="64" x2="265" y2="1114"/>
<rect x="405" y="26" width="110" height="36" rx="5" fill="#ffffff" stroke="#c3ced6" stroke-width="1.5"/>
<text class="hd" x="460" y="50" text-anchor="middle">API</text>
<line class="lf" x1="460" y1="64" x2="460" y2="1114"/>
<rect x="585" y="26" width="190" height="36" rx="5" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="680" y="78" text-anchor="middle" font-size="9.5px" font-family='"IBM Plex Mono",Menlo,Consolas,monospace' fill="#6b3fa0" letter-spacing=".08em">DESIGNED</text>
<text class="hd" x="680" y="50" text-anchor="middle">Language model</text>
<line class="lf" x1="680" y1="64" x2="680" y2="1114"/>
<rect x="815" y="26" width="150" height="36" rx="5" fill="#e0eff0" stroke="#0d6a73" stroke-width="1.5"/>
<text class="hd" x="890" y="50" text-anchor="middle">Search index</text>
<line class="lf" x1="890" y1="64" x2="890" y2="1114"/>
<rect x="990" y="26" width="200" height="36" rx="5" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.5"/>
<text class="hd" x="1090" y="50" text-anchor="middle">Embedding model</text>
<line class="lf" x1="1090" y1="64" x2="1090" y2="1114"/>
<circle cx="26" cy="128" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="132">1</text>
<line class="lu" x1="89" y1="132" x2="261" y2="132" marker-end="url(#hu)"/>
<text class="tu" x="175" y="124" text-anchor="middle">describes the fault, in any language</text>
<text class="d" x="175" y="147" text-anchor="middle">“Customer says there is oil under the machine”</text>
<circle cx="26" cy="162" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="166">2</text>
<line class="ln" x1="269" y1="166" x2="456" y2="166" marker-end="url(#h)"/>
<text class="t" x="362" y="158" text-anchor="middle">POST /sessions</text>
<circle cx="26" cy="196" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="200">3</text>
<line class="la" x1="464" y1="200" x2="676" y2="200" marker-end="url(#hai)"/>
<text class="ta" x="570" y="192" text-anchor="middle">read the features</text>
<text class="d" x="570" y="215" text-anchor="middle">one small call</text>
<circle cx="26" cy="230" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="234">4</text>
<line class="lar" x1="676" y1="234" x2="464" y2="234" marker-end="url(#hai)"/>
<text class="ta" x="570" y="226" text-anchor="middle">fluid = oil · severity = not stated</text>
<text class="d" x="570" y="249" text-anchor="middle">severity unknown — worth asking</text>
<circle cx="26" cy="264" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="268">5</text>
<path class="ln" d="M460 256 H494 V272 H464" stroke="#0d6a73" marker-end="url(#ha)"/>
<text class="tc" x="504" y="269">the text names no machine — ask, never guess</text>
<circle cx="26" cy="298" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="302">6</text>
<line class="lr" x1="456" y1="302" x2="89" y2="302" marker-end="url(#h)"/>
<text class="t" x="272" y="294" text-anchor="middle">nothing rankable yet — asks which machine</text>
<text class="d" x="272" y="317" text-anchor="middle">the families it holds cases for</text>
<circle cx="26" cy="374" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="378">7</text>
<line class="lu" x1="89" y1="378" x2="261" y2="378" marker-end="url(#hu)"/>
<text class="tu" x="175" y="370" text-anchor="middle">taps “Water Chiller CH”</text>
<circle cx="26" cy="408" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="412">8</text>
<line class="ln" x1="269" y1="412" x2="456" y2="412" marker-end="url(#h)"/>
<text class="t" x="362" y="404" text-anchor="middle">POST /answers</text>
<text class="d" x="362" y="427" text-anchor="middle">a button carries a known value — no model call</text>
<circle cx="26" cy="442" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="446">9</text>
<line class="la" x1="464" y1="446" x2="1086" y2="446" marker-end="url(#hai)"/>
<text class="ta" x="775" y="438" text-anchor="middle">embed the query</text>
<text class="d" x="775" y="461" text-anchor="middle"></text>
<circle cx="26" cy="476" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="480">10</text>
<line class="lar" x1="1086" y1="480" x2="464" y2="480" marker-end="url(#hai)"/>
<text class="ta" x="775" y="472" text-anchor="middle">vector</text>
<circle cx="26" cy="510" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="514">11</text>
<line class="ln" x1="464" y1="514" x2="886" y2="514" marker-end="url(#h)"/>
<text class="t" x="675" y="506" text-anchor="middle">kNN + BM25, filtered to the family, fused by RRF</text>
<circle cx="26" cy="544" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="548">12</text>
<line class="lr" x1="886" y1="548" x2="464" y2="548" marker-end="url(#h)"/>
<text class="t" x="675" y="540" text-anchor="middle">neighbours</text>
<text class="d" x="675" y="563" text-anchor="middle">too few at type level — back off to family</text>
<circle cx="26" cy="578" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="582">13</text>
<path class="ln" d="M460 570 H494 V586 H464" stroke="#0d6a73" marker-end="url(#ha)"/>
<text class="tc" x="504" y="583">rank the causes, reserve a share for “something else”, pick the question</text>
<circle cx="26" cy="612" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="616">14</text>
<line class="lr" x1="456" y1="616" x2="89" y2="616" marker-end="url(#h)"/>
<text class="t" x="272" y="608" text-anchor="middle">ranking + one question</text>
<text class="d" x="272" y="631" text-anchor="middle">panel pins the causes; message asks</text>
<circle cx="26" cy="688" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="692">15</text>
<line class="lu" x1="89" y1="692" x2="261" y2="692" marker-end="url(#hu)"/>
<text class="tu" x="175" y="684" text-anchor="middle">types “continuous flow, puddle”</text>
<text class="d" x="175" y="707" text-anchor="middle">free text — the same value a button would send</text>
<circle cx="26" cy="722" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="726">16</text>
<line class="ln" x1="269" y1="726" x2="456" y2="726" marker-end="url(#h)"/>
<text class="t" x="362" y="718" text-anchor="middle">POST /answers</text>
<circle cx="26" cy="756" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="760">17</text>
<line class="la" x1="464" y1="760" x2="676" y2="760" marker-end="url(#hai)"/>
<text class="ta" x="570" y="752" text-anchor="middle">read the answer’s features</text>
<circle cx="26" cy="790" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="794">18</text>
<line class="lar" x1="676" y1="794" x2="464" y2="794" marker-end="url(#hai)"/>
<text class="ta" x="570" y="786" text-anchor="middle">severity = continuous</text>
<circle cx="26" cy="824" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="828">19</text>
<line class="ln" x1="464" y1="828" x2="886" y2="828" marker-end="url(#h)"/>
<text class="t" x="675" y="820" text-anchor="middle">re-retrieve, the answer appended</text>
<circle cx="26" cy="858" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="862">20</text>
<line class="lr" x1="886" y1="862" x2="464" y2="862" marker-end="url(#h)"/>
<text class="t" x="675" y="854" text-anchor="middle">neighbours, re-scored</text>
<circle cx="26" cy="892" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="896">21</text>
<path class="ln" d="M460 884 H494 V900 H464" stroke="#0d6a73" marker-end="url(#ha)"/>
<text class="tc" x="504" y="897">re-rank on the fuller text — the reserved share falls, the order holds</text>
<circle cx="26" cy="926" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="930">22</text>
<line class="lr" x1="456" y1="930" x2="89" y2="930" marker-end="url(#h)"/>
<text class="t" x="272" y="922" text-anchor="middle">updated ranking, no further question</text>
<text class="d" x="272" y="945" text-anchor="middle">1 of 3 questions spent</text>
<circle cx="26" cy="1002" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="1006">23</text>
<line class="lu" x1="89" y1="1006" x2="261" y2="1006" marker-end="url(#hu)"/>
<text class="tu" x="175" y="998" text-anchor="middle">technician confirms “blocked condensate drain”</text>
<circle cx="26" cy="1036" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="1040">24</text>
<line class="ln" x1="269" y1="1040" x2="456" y2="1040" marker-end="url(#h)"/>
<text class="t" x="362" y="1032" text-anchor="middle">POST /close · confirmed_cause_id: CH.DRAIN.CONDENSATE_BLOCKED</text>
<circle cx="26" cy="1070" r="10" fill="#ffffff" stroke="#c3ced6"/>
<text class="num" x="26" y="1074">25</text>
<path class="ln" d="M460 1062 H494 V1078 H464" stroke="#0d6a73" marker-end="url(#ha)"/>
<text class="tc" x="504" y="1075">write the outcome, no TTL — the only ground truth there is</text>
<path d="M56 396 H46 V620 H56" fill="none" stroke="#1a7a4c" stroke-width="1.7"/>
<text x="530" y="618" font-size="12.5px" font-family='"IBM Plex Mono",Menlo,Consolas,monospace' fill="#1a7a4c">&#8592; first candidates land inside the 3 s budget</text>
</svg>
<svg viewBox="0 0 1300 700" xmlns="http://www.w3.org/2000/svg" font-family='"IBM Plex Sans",Helvetica,Arial,sans-serif' role="img" aria-label="Architecture. Offline band: closed cases in S3, normalise and screen, extract a cause with Nova Lite on Bedrock, validate and weigh, embed with Cohere Embed v4, index. State: S3 Parquet, OpenSearch, DynamoDB. Live band: the customer's description, hybrid retrieval, rank, ask one question, confirm. A three second budget covers only the live band.">
<style>
 .ttl{fill:#131a20;font-size:16px;font-weight:700}
 .lane{fill:#5a6773;font-size:11.5px;font-family:"IBM Plex Mono",Menlo,Consolas,monospace;letter-spacing:.11em}
 .t{fill:#131a20;font-size:14px;font-weight:600}
 .s{fill:#5a6773;font-size:12px}
 .m{fill:#5a6773;font-size:11px;font-family:"IBM Plex Mono",Menlo,Consolas,monospace}
 .lbl{fill:#131a20;font-size:12.5px}
 .ln{stroke:#c3ced6;stroke-width:1.6;fill:none}
 .lnd{stroke:#c3ced6;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
</style>
<rect width="1300" height="700" fill="#ffffff"/>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#c3ced6"/></marker>
<marker id="hacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#0d6a73"/></marker>
<marker id="hai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#6b3fa0"/></marker>
<marker id="haws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#b8690f"/></marker>
<marker id="hok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#1a7a4c"/></marker>
<marker id="hact" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#2a4d8f"/></marker>
<text class="ttl" x="30" y="32">How it runs</text>
<text class="m" x="150" y="32">eu-central-1 · everything above the stores is offline</text>
<rect x="900" y="20" width="13" height="13" rx="3" fill="#ffffff" stroke="#c3ced6" stroke-width="1.5"/>
<text class="s" x="919" y="31">our code</text>
<rect x="1000" y="20" width="13" height="13" rx="3" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.5"/>
<text class="s" x="1019" y="31">model call</text>
<rect x="1100" y="20" width="13" height="13" rx="3" fill="#e0eff0" stroke="#0d6a73" stroke-width="1.5"/>
<text class="s" x="1119" y="31">state</text>
<rect x="1200" y="20" width="13" height="13" rx="3" fill="#e3f2ea" stroke="#1a7a4c" stroke-width="1.5"/>
<text class="s" x="1219" y="31">ground truth</text>
<text class="lane" x="30" y="72">OFFLINE · 100k BACKFILL, THEN ~500 A DAY</text>
<rect x="30" y="84" width="230" height="86" rx="6" fill="#ffffff" stroke="#c3ced6" stroke-width="1.6"/>
<text class="t" x="43" y="106" fill="#131a20">Closed cases</text>
<text class="s" x="43" y="124">Parquet on S3</text>
<text class="s" x="43" y="139">DMS + Firehose</text>
<rect x="275" y="84" width="230" height="86" rx="6" fill="#ffffff" stroke="#c3ced6" stroke-width="1.6"/>
<text class="t" x="288" y="106" fill="#131a20">Normalise + screen</text>
<text class="s" x="288" y="124">codes, negation, shorthand</text>
<text class="s" x="288" y="139">3 of 22 never reach a model</text>
<rect x="520" y="84" width="230" height="86" rx="6" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.6"/>
<text x="533" y="101" font-size="9.5px" font-family='"IBM Plex Mono",Menlo,Consolas,monospace' fill="#6b3fa0" letter-spacing=".09em">BEDROCK</text>
<text class="t" x="533" y="120" fill="#6b3fa0">Extract a cause</text>
<text class="s" x="533" y="138">Nova Lite, forced tool call</text>
<text class="s" x="533" y="153">19/19 measured</text>
<rect x="765" y="84" width="230" height="86" rx="6" fill="#ffffff" stroke="#c3ced6" stroke-width="1.6"/>
<text class="t" x="778" y="106" fill="#131a20">Validate + weigh</text>
<text class="s" x="778" y="124">5 checks, never repair</text>
<text class="s" x="778" y="139">weight from status</text>
<rect x="1010" y="84" width="230" height="86" rx="6" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.6"/>
<text x="1023" y="101" font-size="9.5px" font-family='"IBM Plex Mono",Menlo,Consolas,monospace' fill="#6b3fa0" letter-spacing=".09em">BEDROCK</text>
<text class="t" x="1023" y="120" fill="#6b3fa0">Embed + index</text>
<text class="s" x="1023" y="138">Cohere Embed v4, 1024d</text>
<text class="s" x="1023" y="153">only cases that may vote</text>
<path d="M260 127 H273" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<path d="M505 127 H518" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<path d="M750 127 H763" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<path d="M995 127 H1008" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<text class="lane" x="30" y="212">STATE &#183; DESIGNED, IN PROCESS TODAY</text>
<rect x="30" y="224" width="400" height="78" rx="6" fill="#e0eff0" stroke="#0d6a73" stroke-width="1.6" stroke-dasharray="6 4"/>
<text class="t" x="43" y="246" fill="#131a20">S3 · Parquet</text>
<text class="s" x="43" y="264">cases by month, labels by version</text>
<text class="s" x="43" y="279">authoritative; the index rebuilds</text>
<rect x="450" y="224" width="400" height="78" rx="6" fill="#e0eff0" stroke="#0d6a73" stroke-width="1.6" stroke-dasharray="6 4"/>
<text class="t" x="463" y="246" fill="#131a20">OpenSearch</text>
<text class="s" x="463" y="264">knn_vector + BM25 + filters</text>
<text class="s" x="463" y="279">only weight > 0 is indexed</text>
<rect x="870" y="224" width="400" height="78" rx="6" fill="#e0eff0" stroke="#0d6a73" stroke-width="1.6" stroke-dasharray="6 4"/>
<text class="t" x="883" y="246" fill="#131a20">DynamoDB</text>
<text class="s" x="883" y="264">sessions · 8h TTL</text>
<text class="s" x="883" y="279">outcomes · never expire</text>
<path d="M890 170 V196 H230 V220" stroke="#0d6a73" stroke-width="1.8" fill="none" marker-end="url(#hacc)"/>
<path d="M1125 170 V206 H650 V220" stroke="#0d6a73" stroke-width="1.8" fill="none" marker-end="url(#hacc)"/>
<text class="lane" x="30" y="344">LIVE · ONE DIAGNOSIS · 3 s p95</text>
<rect x="30" y="356" width="230" height="86" rx="6" fill="#ffffff" stroke="#c3ced6" stroke-width="1.6"/>
<text class="t" x="43" y="378" fill="#131a20">The customer's words</text>
<text class="s" x="43" y="396">one box, four languages</text>
<text class="s" x="43" y="411">machine read or asked</text>
<rect x="275" y="356" width="230" height="86" rx="6" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="288" y="373" font-size="9.5px" font-family='"IBM Plex Mono",Menlo,Consolas,monospace' fill="#6b3fa0" letter-spacing=".09em">DESIGNED &#183; NOT BUILT</text>
<text class="t" x="288" y="392" fill="#6b3fa0">Read the features</text>
<text class="s" x="288" y="410">designed: one small call</text>
<text class="s" x="288" y="425">today: regex, misses DE</text>
<rect x="520" y="356" width="230" height="86" rx="6" fill="#ffffff" stroke="#c3ced6" stroke-width="1.6"/>
<text class="t" x="533" y="378" fill="#131a20">Hybrid retrieve</text>
<text class="s" x="533" y="396">kNN + BM25, fused by RRF</text>
<text class="s" x="533" y="411">type, then family, stop</text>
<rect x="765" y="356" width="230" height="86" rx="6" fill="#ffffff" stroke="#c3ced6" stroke-width="1.6"/>
<text class="t" x="778" y="378" fill="#131a20">Rank + ask</text>
<text class="s" x="778" y="396">votes, smoothing, reserved</text>
<text class="s" x="778" y="411">one question by info gain</text>
<rect x="1010" y="356" width="230" height="86" rx="6" fill="#e3f2ea" stroke="#1a7a4c" stroke-width="1.6"/>
<text class="t" x="1023" y="378" fill="#131a20">Confirm the cause</text>
<text class="s" x="1023" y="396">or “none of these”</text>
<text class="s" x="1023" y="411">the only ground truth</text>
<path d="M260 399 H273" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<path d="M505 399 H518" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<path d="M750 399 H763" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<path d="M995 399 H1008" stroke="#c3ced6" stroke-width="1.8" fill="none" marker-end="url(#ha)"/>
<path d="M650 302 V330 H635 V352" stroke="#0d6a73" stroke-width="1.8" fill="none" marker-end="url(#hacc)"/>
<path d="M1125 356 V306" stroke="#1a7a4c" stroke-width="1.8" fill="none" marker-end="url(#hok)"/>
<text class="m" x="1136" y="336" fill="#1a7a4c">write outcome</text>
<path d="M30 470 V482 H995 V470" stroke="#1a7a4c" stroke-width="1.8" fill="none"/>
<text x="512" y="502" text-anchor="middle" font-size="12.5px" font-family='"IBM Plex Mono",Menlo,Consolas,monospace' fill="#1a7a4c">3 s p95 to first candidates — a design target, not a measurement</text>
<path d="M1255 442 V566 H18 V150" stroke="#c3ced6" stroke-width="1.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ha)"/>
<text class="s" x="660" y="560" text-anchor="middle">the confirmed cause becomes tomorrow’s closed case, and the calibration set</text>
<text class="m" x="30" y="620" fill="#5a6773">Every expensive step is offline. The live band is one retrieval and arithmetic, which is what makes the budget achievable.</text>
<text class="m" x="30" y="668">Dashed = designed, not built. Live feature reading is regex today, which is why a German query still ranks differently from the same fault in English.</text>
<text class="m" x="30" y="644" fill="#5a6773">Two Protocols — LabelExtractor and TextSimilarity — mean the solid purple boxes are swappable without touching anything else.</text>
</svg>